[package]
name = "briscolab-py"
description = "Python bindings of the Briscolab engine, for the lab."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "briscolab_engine"
crate-type = ["cdylib"]

[dependencies]
briscolab-core = { path = "../core" }
pyo3 = { version = "0.30.1", features = ["abi3-py313"] }
