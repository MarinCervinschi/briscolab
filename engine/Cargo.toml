[workspace]
resolver = "2"
members = ["core", "py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MarinCervinschi/briscolab"

# The search bots make the property tests slow unoptimised; overflow checks and debug assertions stay on.
[profile.test]
opt-level = 2
