server {
	listen 8080;
	root /usr/share/nginx/html;
	absolute_redirect off;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;

	# Every page is prerendered as a folder: /play is /play/index.html.
	location / {
		try_files $uri $uri/index.html =404;
	}

	# Vite names these files after their content, so they never change.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The service worker must be fetched fresh, or a new build never reaches installed copies.
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}

	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# The app's router shows its own not-found page.
	error_page 404 /index.html;
}
